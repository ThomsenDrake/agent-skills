name: Update pstack from cursor/plugins

on:
  schedule:
    # daily 14:00 UTC = 9am ET (EST) / 10am ET (EDT); GitHub cron is UTC-only
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check the update, but don't push or open a PR
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-pstack
  cancel-in-progress: false

jobs:
  # Holds the model key. Read-only: it only produces a patch and a report.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install skills-ref==0.1.1
      - name: Test the sync script
        run: python -m unittest discover -s scripts/pstack/tests
      - name: Build the update
        id: build
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PSTACK_MODEL: ${{ vars.PSTACK_MODEL }}
        run: python scripts/pstack/sync.py build --out "$RUNNER_TEMP/pstack-update"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.build.outputs.status != 'noop'
        with:
          name: pstack-update
          path: ${{ runner.temp }}/pstack-update/
          if-no-files-found: error
          retention-days: 14

  # Holds the write token, not the model key. Reruns the checks before it trusts the patch.
  publish:
    needs: build
    if: >-
      needs.build.outputs.status != 'noop' &&
      github.ref == 'refs/heads/main' &&
      !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install skills-ref==0.1.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pstack-update
          path: ${{ runner.temp }}/pstack-update
      - name: Land on main, or update the review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pstack/sync.py publish --artifact "$RUNNER_TEMP/pstack-update" --repository "$GITHUB_REPOSITORY"
